{{ $subscribeAction := getenv "HUGO_EMAIL_SUBSCRIBE_FORM_URL" }}
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style type="text/css">
  #subscribe-email {
    width: 302px;
    max-width: 100%;
  }
  #subscribe-email label,
  #subscribe-email button {
    margin: 1rem 0;
  }
  #subscribe-email .h-captcha {
    margin-bottom: 0;
  }

  #subscribe-email label {
    width: 100%;
    display: flex;
    gap: 1rem;
  }
  #subscribe-email label input {
    flex: 1;
  }

  #subscribe-email button[type=submit] {

  }

  #form-error:not(:empty) {
    color: rgb(166, 0, 0);
    background-color: rgba(166, 0, 0, 0.15);
    border: 1px solid rgb(166, 0, 0);
    border-radius: 4px;
    padding: 0.25rem 0.5rem;
    margin-top: 0.5rem;
  }

  #subscribe-email-success .email {
    font-family: monospace;
  }
</style>
<form id="subscribe-email" action="{{ $subscribeAction }}" method="post">
  <label>
    <span>Email</span>
    <input type="text" name="email" placeholder="" required />
  </label>
  <div class="h-captcha" data-sitekey="823ab412-14b2-4082-b2e4-d90ceb121c8c"></div>
  <div id="form-error"></div>
  <button type="submit">Subscribe</button>
</form>
<script type="text/javascript">
  const form = document.querySelector("#subscribe-email");
  const formError = form.querySelector("#form-error");
  const formButton = form.querySelector("button[type=submit]");

  async function submitForm() {
    const formData = new FormData(form);
    formError.innerText = "";
    formButton.disabled = true;

    try {
      const response = await fetch("{{ $subscribeAction }}", {
        method: "POST",
        body: formData,
      });
      if (!response.ok) {
        const message = await response.text();
        throw new Error(message);
      }

      const result = await response.json();
      if (result.success) {
        const success = document.createElement("div");
        success.id = "subscribe-email-success";
        success.innerHTML = `Successfully subscribed <span class="email"></span> ✅`;
        success.querySelector(".email").innerText = result.email;
        form.replaceWith(success);
      }
    } catch (error) {
      console.error(error);
      formError.innerText = "⚠️ " + error.message;
    } finally {
      formButton.disabled = false;
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    submitForm();
  });
</script>
